<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas para Ti 🌻✨</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #05020a;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            user-select: none;
        }

        .font-love {
            font-family: 'Great Vibes', cursive;
        }

        .font-romantic {
            font-family: 'Dancing Script', cursive;
        }

        /* Ambient Glow & Background FX */
        .glow-bg {
            background: radial-gradient(circle at center, rgba(255, 215, 0, 0.15) 0%, rgba(13, 2, 22, 0.8) 60%, rgba(5, 2, 10, 1) 100%);
        }

        .card-glass {
            background: rgba(20, 10, 30, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2), inset 0 0 15px rgba(255, 215, 0, 0.1);
        }

        .btn-gold {
            background: linear-gradient(135deg, #ffd700 0%, #ffa500 50%, #ff8c00 100%);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6), 0 0 40px rgba(255, 165, 0, 0.4);
            transition: all 0.3s ease;
        }

        .btn-gold:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.9), 0 0 50px rgba(255, 165, 0, 0.7);
        }

        .btn-gold:active {
            transform: scale(0.98);
        }

        /* Text Glow Animations */
        .text-glow-gold {
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.5), 0 0 30px rgba(255, 165, 0, 0.3);
        }

        /* Pulsing Glow */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.03); }
        }

        .pulse-element {
            animation: pulseGlow 3s infinite ease-in-out;
        }

        /* Fade transitions */
        .fade-out {
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s ease;
        }

        .fade-in {
            opacity: 1;
            transition: opacity 1.2s ease;
        }

        /* Custom scrollbar hidden */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden glow-bg select-none">

    <!-- Audio Element (Web Audio API synth fallback if blocked) -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-112199.mp3" type="audio/mpeg">
    </audio>

    <!-- Music Toggle Button (Upper Right) -->
    <button id="music-btn" class="fixed top-5 right-5 z-40 w-12 h-12 rounded-full card-glass flex items-center justify-center text-yellow-300 hover:text-white transition-all duration-300 focus:outline-none">
        <i id="music-icon" class="fas fa-music text-lg"></i>
    </button>

    <!-- WELCOME / INTRO SCREEN OVERLAY -->
    <div id="welcome-screen" class="fixed inset-0 z-30 flex items-center justify-center p-4 transition-opacity duration-1000">
        <div class="card-glass max-w-md w-full rounded-3xl p-8 text-center flex flex-col items-center relative overflow-hidden pulse-element">
            <!-- Decorative Gold Rings -->
            <div class="absolute -top-12 -left-12 w-32 h-32 rounded-full border border-yellow-400/20"></div>
            <div class="absolute -bottom-12 -right-12 w-32 h-32 rounded-full border border-yellow-400/20"></div>
            
            <!-- Cute Flower & Infinity Icon -->
            <div class="text-yellow-400 text-3xl mb-2">
                <i class="fas fa-infinity"></i>
            </div>
            <p class="text-xs uppercase tracking-widest text-yellow-200/80 mb-1 font-semibold">Love You Always</p>
            
            <h1 class="font-love text-5xl md:text-6xl text-yellow-300 my-2 text-glow-gold">
                Flores Amarillas
            </h1>
            <p class="font-romantic text-2xl text-yellow-100/90 mb-6">para ti ✨</p>
            
            <!-- Sunflower Illustration Container -->
            <div class="w-36 h-36 my-2 relative flex items-center justify-center">
                <div class="absolute inset-0 bg-yellow-500/20 rounded-full filter blur-xl"></div>
                <svg class="w-32 h-32 text-yellow-400 animate-spin-slow" viewBox="0 0 100 100" style="animation-duration: 25s;">
                    <g transform="translate(50,50)">
                        <!-- Petals -->
                        <path d="M0,-15 C5,-35 15,-35 0,-48 C-15,-35 -5,-35 0,-15" fill="#FFD700"/>
                        <path d="M0,-15 C5,-35 15,-35 0,-48 C-15,-35 -5,-35 0,-15" fill="#FFC107" transform="rotate(30)"/>
                        <path d="M0,-15 C5,-35 15,-35 0,-48 C-15,-35 -5,-35 0,-15" fill="#FFD700" transform="rotate(60)"/>
                        <path d="M0,-15 C5,-35 15,-35 0,-48 C-15,-35 -5,-35 0,-15" fill="#FFC107" transform="rotate(90)"/>
                        <path d="M0,-15 C5,-35 15,-35 0,-48 C-15,-35 -5,-35 0,-15" fill="#FFD700" transform="rotate(120)"/>
                        <path d="M0,-15 C5,-35 15,-35 0,-48 C-15,-35 -5,-35 0,-15" fill="#FFC107" transform="rotate(150)"/>
                        <path d="M0,-15 C5,-35 15,-35 0,-48 C-15,-35 -5,-35 0,-15" fill="#FFD700" transform="rotate(180)"/>
                        <path d="M0,-15 C5,-35 15,-35 0,-48 C-15,-35 -5,-35 0,-15" fill="#FFC107" transform="rotate(210)"/>
                        <path d="M0,-15 C5,-35 15,-35 0,-48 C-15,-35 -5,-35 0,-15" fill="#FFD700" transform="rotate(240)"/>
                        <path d="M0,-15 C5,-35 15,-35 0,-48 C-15,-35 -5,-35 0,-15" fill="#FFC107" transform="rotate(270)"/>
                        <path d="M0,-15 C5,-35 15,-35 0,-48 C-15,-35 -5,-35 0,-15" fill="#FFD700" transform="rotate(300)"/>
                        <path d="M0,-15 C5,-35 15,-35 0,-48 C-15,-35 -5,-35 0,-15" fill="#FFC107" transform="rotate(330)"/>
                        <!-- Center -->
                        <circle cx="0" cy="0" r="16" fill="#5D4037"/>
                        <circle cx="0" cy="0" r="13" fill="#3E2723"/>
                    </g>
                </svg>
            </div>

            <p class="text-xs text-yellow-200/70 my-4 px-4 font-light leading-relaxed">
                He creado un universo completo de estrellas y girasoles dorados solo para ti.
            </p>

            <!-- Action Button -->
            <button id="start-btn" class="btn-gold font-semibold text-gray-950 px-8 py-3.5 rounded-full text-base tracking-wider uppercase flex items-center gap-2 cursor-pointer mt-2">
                <span>VER GALAXIA</span>
                <i class="fas fa-sparkles"></i>
            </button>
        </div>
    </div>

    <!-- TOP MAIN HEADER (Floating Message Overlay) -->
    <div id="main-header" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-20 text-center pointer-events-none opacity-0 transition-opacity duration-1000">
        <h2 class="font-love text-5xl md:text-7xl text-yellow-300 text-glow-gold tracking-wide">
            Te amo
        </h2>
        <p class="font-romantic text-lg md:text-xl text-yellow-200/90 tracking-widest mt-1">
            Eres mi sol y mi universo 🌻
        </p>
    </div>

    <!-- INSTRUCTION & CONTROLS HELPER (Bottom Floating Overlay) -->
    <div id="ui-controls" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-20 flex flex-col items-center gap-2 pointer-events-none opacity-0 transition-opacity duration-1000">
        <div class="card-glass px-5 py-2.5 rounded-full flex items-center gap-3 text-xs md:text-sm text-yellow-200/90 shadow-lg pointer-events-auto">
            <span class="flex items-center gap-1.5"><i class="fas fa-hand-pointer text-yellow-400"></i> Arrastra para rotar</span>
            <span class="text-yellow-500">•</span>
            <span class="flex items-center gap-1.5"><i class="fas fa-search-plus text-yellow-400"></i> Zoom</span>
        </div>
    </div>

    <!-- CANVAS CONTAINER FOR THREE.JS -->
    <div id="canvas-container" class="w-full h-full absolute inset-0 z-10"></div>

    <script>
        // Global Variables
        let scene, camera, renderer, controls;
        let galaxyGroup, coreMesh, particleSystem, flowersGroup, textSpritesGroup;
        let clock = new THREE.Clock();
        let isStarted = false;

        // Custom Love Messages to orbit in 3D Galaxy
        const loveMessages = [
            "Te amo", "Mi girasol", "Para siempre", 
            "Amor de mi vida", "Mi destino", "Eres mi luz", 
            "Juntos por siempre", "Mi estrella", "Tú y Yo"
        ];

        // Initialize Application
        window.addEventListener('load', () => {
            initThreeJS();
            setupEvents();
            animate();
        });

        function initThreeJS() {
            const container = document.getElementById('canvas-container');

            // 1. Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x05020a, 0.015);

            // 2. Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 25, 45);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            // 4. Orbit Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 100;
            controls.minDistance = 10;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.8;

            // 5. Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffd700, 3, 60);
            pointLight.position.set(0, 0, 0);
            scene.add(pointLight);

            // Master Group for Galaxy
            galaxyGroup = new THREE.Group();
            scene.add(galaxyGroup);

            createCentralGlowingCore();
            createGoldenParticleGalaxy();
            createSunflowerOrbiters();
            createTextOrbiters();
        }

        function createCentralGlowingCore() {
            const coreGroup = new THREE.Group();

            // Core Geometry
            const geometry = new THREE.IcosahedronGeometry(3.5, 4);
            const material = new THREE.MeshBasicMaterial({
                color: 0xffd700,
                wireframe: true,
                transparent: true,
                opacity: 0.6
            });

            coreMesh = new THREE.Mesh(geometry, material);
            coreGroup.add(coreMesh);

            // Inner Bright Sphere
            const innerGeo = new THREE.SphereGeometry(2.2, 32, 32);
            const innerMat = new THREE.MeshBasicMaterial({ color: 0xffea00 });
            const innerSphere = new THREE.Mesh(innerGeo, innerMat);
            coreGroup.add(innerSphere);

            // Glowing Texture Sprite Halo
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255, 230, 100, 1)');
            gradient.addColorStop(0.3, 'rgba(255, 180, 0, 0.6)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 128);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                blending: THREE.AdditiveBlending
            });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(16, 16, 1);
            coreGroup.add(sprite);

            galaxyGroup.add(coreGroup);
        }

        function createGoldenParticleGalaxy() {
            const particleCount = 12000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const scales = new Float32Array(particleCount);

            const parameters = {
                branches: 4,
                radius: 35,
                spin: 1.2,
                randomness: 0.5,
                power: 3
            };

            const colorInside = new THREE.Color(0xffea00); // Bright Yellow
            const colorOutside = new THREE.Color(0xff4500); // Warm Orange-Pink

            for (let i = 0; i < particleCount; i++) {
                // Position along spiral arm
                const r = Math.pow(Math.random(), parameters.power) * parameters.radius;
                const branchAngle = ((i % parameters.branches) / parameters.branches) * Math.PI * 2;
                const spinAngle = r * parameters.spin;

                const randomX = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * r;
                const randomY = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * r;
                const randomZ = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * r;

                positions[i * 3] = Math.cos(branchAngle + spinAngle) * r + randomX;
                positions[i * 3 + 1] = randomY;
                positions[i * 3 + 2] = Math.sin(branchAngle + spinAngle) * r + randomZ;

                // Colors interpolation
                const mixedColor = colorInside.clone();
                mixedColor.lerp(colorOutside, r / parameters.radius);
                
                colors[i * 3] = mixedColor.r;
                colors[i * 3 + 1] = mixedColor.g;
                colors[i * 3 + 2] = mixedColor.b;

                // Particle size
                scales[i] = Math.random() * 0.4 + 0.1;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Particle Texture
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.5, 'rgba(255,215,0,0.8)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);

            const pTexture = new THREE.CanvasTexture(canvas);

            const material = new THREE.PointsMaterial({
                size: 0.6,
                sizeAttenuation: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                vertexColors: true,
                map: pTexture,
                transparent: true
            });

            particleSystem = new THREE.Points(geometry, material);
            galaxyGroup.add(particleSystem);
        }

        function createSunflowerTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.translate(128, 128);

            // Draw Petals
            const petalCount = 16;
            for (let i = 0; i < petalCount; i++) {
                ctx.rotate((Math.PI * 2) / petalCount);
                ctx.beginPath();
                ctx.ellipse(0, -70, 18, 45, 0, 0, Math.PI * 2);
                const petalGrad = ctx.createLinearGradient(0, -25, 0, -115);
                petalGrad.addColorStop(0, '#FF8C00');
                petalGrad.addColorStop(0.3, '#FFD700');
                petalGrad.addColorStop(1, '#FFF59D');
                ctx.fillStyle = petalGrad;
                ctx.fill();
            }

            // Center Dark Disc
            ctx.beginPath();
            ctx.arc(0, 0, 42, 0, Math.PI * 2);
            const centerGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, 42);
            centerGrad.addColorStop(0, '#3E2723');
            centerGrad.addColorStop(0.8, '#4E342E');
            centerGrad.addColorStop(1, '#212121');
            ctx.fillStyle = centerGrad;
            ctx.fill();

            // Texture seed dots
            ctx.fillStyle = '#8D6E63';
            for (let i = 0; i < 60; i++) {
                const angle = i * 0.5;
                const dist = Math.sqrt(i) * 5;
                ctx.beginPath();
                ctx.arc(Math.cos(angle) * dist, Math.sin(angle) * dist, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        function createSunflowerOrbiters() {
            flowersGroup = new THREE.Group();
            const flowerTexture = createSunflowerTexture();
            const flowerGeo = new THREE.PlaneGeometry(2.5, 2.5);
            const flowerMat = new THREE.MeshBasicMaterial({
                map: flowerTexture,
                transparent: true,
                side: THREE.DoubleSide,
                depthWrite: false
            });

            const count = 45;
            for (let i = 0; i < count; i++) {
                const mesh = new THREE.Mesh(flowerGeo, flowerMat);
                
                // Spiral Placement
                const radius = 6 + Math.random() * 26;
                const angle = Math.random() * Math.PI * 2;
                const height = (Math.random() - 0.5) * 6;

                mesh.position.set(
                    Math.cos(angle) * radius,
                    height,
                    Math.sin(angle) * radius
                );

                // Random Rotation & Scale
                mesh.rotation.x = Math.random() * Math.PI;
                mesh.rotation.y = Math.random() * Math.PI;
                const scale = 0.8 + Math.random() * 0.9;
                mesh.scale.set(scale, scale, scale);

                // Custom Animation Data
                mesh.userData = {
                    radius: radius,
                    angle: angle,
                    speed: 0.15 + Math.random() * 0.25,
                    rotSpeed: (Math.random() - 0.5) * 0.02
                };

                flowersGroup.add(mesh);
            }
            galaxyGroup.add(flowersGroup);
        }

        function createTextSprite(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.font = 'Bold 44px "Dancing Script", "Great Vibes", cursive';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Glow Effect
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(text, 256, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthWrite: false
            });

            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(8, 2, 1);
            return sprite;
        }

        function createTextOrbiters() {
            textSpritesGroup = new THREE.Group();

            loveMessages.forEach((msg, idx) => {
                const sprite = createTextSprite(msg);
                const radius = 10 + (idx * 2.5);
                const angle = (idx / loveMessages.length) * Math.PI * 2;
                const height = (Math.random() - 0.5) * 5;

                sprite.position.set(
                    Math.cos(angle) * radius,
                    height,
                    Math.sin(angle) * radius
                );

                sprite.userData = {
                    radius: radius,
                    angle: angle,
                    speed: 0.1 + Math.random() * 0.15
                };

                textSpritesGroup.add(sprite);
            });

            galaxyGroup.add(textSpritesGroup);
        }

        function setupEvents() {
            const startBtn = document.getElementById('start-btn');
            const welcomeScreen = document.getElementById('welcome-screen');
            const mainHeader = document.getElementById('main-header');
            const uiControls = document.getElementById('ui-controls');
            const musicBtn = document.getElementById('music-btn');
            const bgMusic = document.getElementById('bg-music');
            const musicIcon = document.getElementById('music-icon');

            let isPlaying = false;

            // Start Button Click Action
            startBtn.addEventListener('click', () => {
                isStarted = true;
                
                // Hide Welcome Card
                welcomeScreen.classList.add('fade-out');
                setTimeout(() => {
                    welcomeScreen.style.display = 'none';
                    mainHeader.classList.remove('opacity-0');
                    uiControls.classList.remove('opacity-0');
                    mainHeader.classList.add('fade-in');
                    uiControls.classList.add('fade-in');
                }, 1000);

                // Play Audio
                bgMusic.play().then(() => {
                    isPlaying = true;
                }).catch(() => {
                    // Fallback synthesizer if browser blocks audio autoplay
                    playFallbackSynth();
                    isPlaying = true;
                });
            });

            // Music Toggle Button
            musicBtn.addEventListener('click', () => {
                if (isPlaying) {
                    bgMusic.pause();
                    musicIcon.className = 'fas fa-music-slash text-red-400';
                    isPlaying = false;
                } else {
                    bgMusic.play().catch(() => playFallbackSynth());
                    musicIcon.className = 'fas fa-music text-yellow-300';
                    isPlaying = true;
                }
            });

            // Window Resize
            window.addEventListener('resize', onWindowResize);
        }

        // Simple Ambient Synthesizer Fallback if audio URL fails
        function playFallbackSynth() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [261.63, 329.63, 392.00, 493.88, 523.25]; // C E G B C
                let noteIdx = 0;

                setInterval(() => {
                    if (!isStarted) return;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(notes[noteIdx % notes.length], ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 2.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 2.5);
                    noteIdx++;
                }, 800);
            } catch(e) { console.log('Audio Context Error', e); }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Rotate Core
            if (coreMesh) {
                coreMesh.rotation.y += 0.008;
                coreMesh.rotation.x += 0.004;
            }

            // Rotate Main Galaxy Particle System
            if (particleSystem) {
                particleSystem.rotation.y = time * 0.05;
            }

            // Orbit Sunflowers
            if (flowersGroup) {
                flowersGroup.children.forEach(flower => {
                    const data = flower.userData;
                    data.angle += data.speed * delta * 0.5;
                    flower.position.x = Math.cos(data.angle) * data.radius;
                    flower.position.z = Math.sin(data.angle) * data.radius;
                    flower.rotation.z += data.rotSpeed;
                });
            }

            // Orbit Love Text Messages
            if (textSpritesGroup) {
                textSpritesGroup.children.forEach(sprite => {
                    const data = sprite.userData;
                    data.angle += data.speed * delta * 0.4;
                    sprite.position.x = Math.cos(data.angle) * data.radius;
                    sprite.position.z = Math.sin(data.angle) * data.radius;
                });
            }

            // Controls update
            controls.update();

            // Render
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
